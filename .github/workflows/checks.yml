name: Test and build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install ".[test,build]"
      - name: Test
        run: python -m pytest -q
      - name: Build desktop app
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: courseware-kit-windows
          path: |
            dist/courseware-kit.exe
            dist/LICENSE
            dist/licenses/
